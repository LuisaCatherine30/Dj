<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <title>DJ Disco Room</title>

    <style>
        body{
            margin:0;
            overflow:hidden;
            background:black;
        }
    </style>
</head>

<body>

<a-scene
    fog="type: exponential; color: #000000; density: 0.02">



    <!-- AUDIO -->
    <audio id="audio"></audio>


    <!-- LUCES -->
    
    <!-- Luz ambiente -->
    <a-light
        type="ambient"
        color="#8888ff"
        intensity="1.2">
    </a-light>


    <!-- Spots superiores -->
    <a-light
        type="spot"
        color="#00ffff"
        position="8 12 0"
        angle="40"
        penumbra="0.5"
        intensity="7"
        target="#dj">
    </a-light>

    <a-light
        type="spot"
        color="#ff00ff"
        position="-8 12 0"
        angle="40"
        penumbra="0.5"
        intensity="7"
        target="#dj">
    </a-light>


    <!-- Luces laterales -->
    <a-light
        type="point"
        color="#00ffff"
        position="6 5 -4"
        intensity="4">
    </a-light>

    <a-light
        type="point"
        color="#ff00ff"
        position="-6 5 -4"
        intensity="4">
    </a-light>


    
    <!-- MODELO DJ -->

    <a-entity
        id="dj"
        gltf-model="https://luisacatherine30.github.io/Dj/All in one vinyl DJ unit.glb"
        position="0 0 -5"
        rotation="0 180 0"
        scale="10 10 10">
    </a-entity>


    <!-- BOTON NEXT -->

    <a-cylinder
        id="nextBtn"
        position="3.15 0.4 -4.45"
        radius="1.3"
        height="0.12"
        color="#000000"
        material="emissive:#111111; metalness:1; roughness:0.2"

        animation__hover="
        property: scale;
        startEvents: mouseenter;
        to: 1.08 1.08 1.08;
        dur: 150"

        animation__leave="
        property: scale;
        startEvents: mouseleave;
        to: 1 1 1;
        dur: 150"

        animation__click="
        property: position;
        startEvents: click;
        to: 3.15 0.3 -4.45;
        dur: 100;
        dir: alternate">
    </a-cylinder>


    <!-- BOTON BACK -->

    <a-cylinder
        id="backBtn"
        position="-3.15 0.4 -4.45"
        radius="1.3"
        height="0.12"
        color="#000000"
        material="emissive:#111111; metalness:1; roughness:0.2"

        animation__hover="
        property: scale;
        startEvents: mouseenter;
        to: 1.08 1.08 1.08;
        dur: 150"

        animation__leave="
        property: scale;
        startEvents: mouseleave;
        to: 1 1 1;
        dur: 150"

        animation__click="
        property: position;
        startEvents: click;
        to: -3.15 0.3 -4.45;
        dur: 100;
        dir: alternate">
    </a-cylinder>


    <!-- COLUMNAS NEON -->

    <a-cylinder
        position="-9 5 -8"
        radius="0.25"
        height="10"
        color="#00ffff"
        material="emissive:#00ffff;">
    </a-cylinder>

    <a-cylinder
        position="9 5 -8"
        radius="0.25"
        height="10"
        color="#ff00ff"
        material="emissive:#ff00ff;">
    </a-cylinder>

    <a-cylinder
        position="-13 5 -14"
        radius="0.25"
        height="10"
        color="#00ff88"
        material="emissive:#00ff88;">
    </a-cylinder>

    <a-cylinder
        position="13 5 -14"
        radius="0.25"
        height="10"
        color="#ff2200"
        material="emissive:#ff2200;">
    </a-cylinder>



    <!-- PANELES LED -->

    <a-plane
        position="-10 6 -13"
        width="5"
        height="8"
        color="#00ffff"
        material="emissive:#00ffff; opacity:0.45;">
    </a-plane>

    <a-plane
        position="10 6 -13"
        width="5"
        height="8"
        color="#ff00ff"
        material="emissive:#ff00ff; opacity:0.45;">
    </a-plane>

    <!-- TITULO DJ DISCO ROOM -->

    <a-text
        value="DJ DISCO ROOM"
        position="0 5.5 0"
        color="#ffffff"
        width="18"
        align="center"
        shader="msdf"

        animation="
        property: rotation;
        to: 0 5 0;
        dir: alternate;
        loop: true;
        dur: 2000"

        animation__zoom="
        property: scale;
        from: 1 1 1;
        to: 1.1 1.1 1.1;
        dir: alternate;
        loop: true;
        dur: 1200">
    </a-text>


    <!-- LASERS -->

    <a-box
        position="-8 12 -5"
        depth="20"
        height="0.08"
        width="0.08"
        color="#00ffff"
        material="emissive:#00ffff"
        rotation="0 0 45">
    </a-box>

    <a-box
        position="8 12 -5"
        depth="20"
        height="0.08"
        width="0.08"
        color="#ff00ff"
        material="emissive:#ff00ff"
        rotation="0 0 -45">
    </a-box>


  
    <!-- SKY -->

    <a-sky color="#02030a"></a-sky>


    <!-- CAMARA -->

    <a-camera
        position="0 4 7"
        rotation="-25 0 0">

        <a-cursor
            color="#ffffff">
        </a-cursor>

    </a-camera>

</a-scene>


<script>

const audio = document.getElementById("audio");


// CANCIONES
const cancionNext = "canciones/cancion1.mp3";
const cancionBack = "canciones/cancion2.mp3";


// BOTONES
const nextBtn = document.querySelector("#nextBtn");
const backBtn = document.querySelector("#backBtn");




// NEXT
nextBtn.addEventListener("mouseenter", () => {

    audio.src = cancionNext;

    audio.play();

    nextBtn.setAttribute(
        "material",
        "emissive:#ff00ff; metalness:1; roughness:0.2"
    );

});


// BACK

backBtn.addEventListener("mouseenter", () => {

    audio.src = cancionBack;

    audio.play();

    backBtn.setAttribute(
        "material",
        "emissive:#00ffff; metalness:1; roughness:0.2"
    );

});




// DETENER AUDIO
nextBtn.addEventListener("mouseleave", () => {

    audio.pause();

    nextBtn.setAttribute(
        "material",
        "emissive:#111111; metalness:1; roughness:0.2"
    );

});


backBtn.addEventListener("mouseleave", () => {

    audio.pause();

    backBtn.setAttribute(
        "material",
        "emissive:#111111; metalness:1; roughness:0.2"
    );

});


</script>

</body>
</html>
